services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: foodops
      POSTGRES_USER: foodops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodops -d foodops"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://foodops:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/foodops
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RAG_EMBEDDINGS: ${RAG_EMBEDDINGS:-tfidf}
      DEMO_SEED: 'true'
      FRONTEND_ORIGIN: http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
volumes:
  postgres_data:
